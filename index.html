<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the stored / system color theme before first paint so the page
      // never starts in the wrong mode and the theme-switch CSS transition
      // doesn't fire on initial load.
      (function () {
        try {
          var stored = localStorage.getItem('u-festival-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage may be unavailable (private mode) — ignore. */
        }
      })();
    </script>
    <script>
      // Capture `beforeinstallprompt` as early as possible — it can fire before
      // React mounts, so we stash it in a tiny store that the app reads later.
      (function () {
        var store = { prompt: null, listeners: [] };
        window.__pwaInstall = store;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          store.prompt = e;
          store.listeners.slice().forEach(function (cb) {
            cb(e);
          });
        });
        window.addEventListener('appinstalled', function () {
          store.prompt = null;
          store.listeners.slice().forEach(function (cb) {
            cb(null);
          });
        });
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F03228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="❤️U Festival" />
    <link rel="apple-touch-icon" href="/icons/logo-white-192.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <title>❤️U Festival</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
